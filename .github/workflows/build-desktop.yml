# Build SeuratExplorer desktop installers (Windows + macOS) with shinyelectron.
#
#   build-pkg : builds the SeuratExplorer source package once (artifact).
#   build     : per-platform Electron build using the *fork* of shinyelectron
#               that supports `dependencies.r.local_packages` and `updates`.
#   release   : on a v* tag, attaches installers + latest*.yml to a GitHub
#               Release (electron-updater reads them).
#
# Placement: copy to .github/workflows/build-desktop.yml in the
#            fentouxungui/SeuratExplorer repository.
#
# IMPORTANT (Node.js)
#   * Do NOT call shinyelectron::install_nodejs() in this workflow/script.
#     In CI its managed Node is preferred by validate_node_npm() but is not
#     resolving/running, and there is no fallback. Instead provide Node.js via
#     actions/setup-node so get_node_command() falls back to the PATH node.
#   * Local/desktop builds can still use install_nodejs().

name: Build Desktop App

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-pkg:
    name: Build SeuratExplorer source package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: R CMD build
        run: R CMD build . --no-build-vignettes --no-manual
      - uses: actions/upload-artifact@v4
        with:
          name: seurat-explorer-src
          path: SeuratExplorer_*.tar.gz
          if-no-files-found: error

  build:
    name: Build (${{ matrix.platform }})
    needs: build-pkg
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: win }
          - { os: macos-latest,   platform: mac }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Node.js + npm on PATH (Node 24 -> npm >= 11.5), so
      # shinyelectron::get_node_command() resolves node/npm from PATH.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch the SeuratExplorer source package
        uses: actions/download-artifact@v5
        with:
          name: seurat-explorer-src
          path: dependency

      - name: Install shinyelectron (fork)
        shell: Rscript {0}
        run: |
          install.packages("pak")
          # The fork has an undeclared `rlang` dependency; install it explicitly.
          pak::pak(c("fentouxungui/shinyelectron", "rlang", "renv"))
          cat("libPaths:\n"); print(.libPaths())
          print(find.package("shinyelectron", quiet = TRUE))
          print(find.package("rlang", quiet = TRUE))

      - name: Verify the toolchain
        shell: Rscript {0}
        run: |
          cat("PATH node :", Sys.which("node"), "\n")
          cat("PATH npm  :", Sys.which("npm"), "\n")
          system("node --version"); system("npm --version")
          # Should be NULL / FALSE here (no install_nodejs() call). If a managed
          # Node path is reported, the workflow is still calling install_nodejs().
          cat("managed node     :", shinyelectron:::nodejs_executable(), "\n")
          cat("managed installed:", shinyelectron:::nodejs_is_installed(), "\n")

      - name: Build the desktop app
        shell: Rscript {0}
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          APP_VERSION: ${{ github.ref_name }}
        run: source("Build-Desktop-software-by-shinyelectron.R")

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            build/**/*.exe
            build/**/*.dmg
            build/**/*.blockmap
            build/**/*.yml

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
