# Build SeuratExplorer desktop installers (Windows + macOS) with shinyelectron.
#
#   build-pkg : builds the SeuratExplorer source package once (artifact).
#   build     : per-platform Electron build using the *fork* of shinyelectron
#               that supports `dependencies.r.local_packages` and `updates`.
#   release   : on a v* tag, attaches installers + latest*.yml to a GitHub
#               Release (electron-updater reads them).
#
# Placement: copy to .github/workflows/build-desktop.yml in the
#            fentouxungui/SeuratExplorer repository.
#
# Notes
#   * Linux is intentionally excluded: the `bundled` runtime ships portable R,
#     which upstream publishes for macOS/Windows only.
#   * macOS/Windows builds are UNSIGNED, so first launch shows Gatekeeper /
#     SmartScreen prompts. Add signing secrets and `sign: 'true'` for smooth
#     distribution (and macOS auto-update requires signing + notarization).
#   * Do NOT call shinyelectron::install_nodejs() in CI. Provide Node.js with
#     actions/setup-node; get_node_command() falls back to the PATH node.
#   * The fork uses `rlang` (not declared) and `withr` (declared only in
#     Suggests) at runtime, so install both explicitly.
#   * Upload/Release globs deliberately use single `*` (NOT `**`): the
#     electron-builder output dir also contains win-unpacked/ and the bundled R
#     runtime, and a recursive glob would upload the whole app.

name: Build Desktop App

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-pkg:
    name: Build SeuratExplorer source package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: R CMD build
        run: R CMD build . --no-build-vignettes --no-manual
      - uses: actions/upload-artifact@v4
        with:
          name: seurat-explorer-src
          path: SeuratExplorer_*.tar.gz
          if-no-files-found: error

  build:
    name: Build (${{ matrix.platform }})
    needs: build-pkg
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: win }
          - { os: macos-latest,   platform: mac }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Node.js + npm on PATH (Node 24 -> npm >= 11.5).
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch the SeuratExplorer source package
        uses: actions/download-artifact@v5
        with:
          name: seurat-explorer-src
          path: dependency

      - name: Install shinyelectron (fork) and its runtime deps
        shell: Rscript {0}
        run: |
          install.packages("pak")
          pak::pak(c("fentouxungui/shinyelectron", "rlang", "withr", "renv"))
          cat("libPaths:\n"); print(.libPaths())
          print(find.package("shinyelectron", quiet = TRUE))
          print(find.package("rlang", quiet = TRUE))
          print(find.package("withr", quiet = TRUE))

      - name: Verify the toolchain
        shell: Rscript {0}
        run: |
          cat("PATH node :", Sys.which("node"), "\n")
          cat("PATH npm  :", Sys.which("npm"), "\n")
          system("node --version"); system("npm --version")

      - name: Build the desktop app
        shell: Rscript {0}
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          APP_VERSION: ${{ github.ref_name }}
        run: source("Build-Desktop-software-by-shinyelectron.R")

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          if-no-files-found: error
          # Top level of electron-builder's output dir only (* not **), so
          # win-unpacked/, the bundled R runtime, app-update.yml, *.so.yml, etc.
          # are NOT uploaded.
          path: |
            build/electron-app/dist/*.exe
            build/electron-app/dist/*.exe.blockmap
            build/electron-app/dist/*.dmg
            build/electron-app/dist/*.dmg.blockmap
            build/electron-app/dist/latest*.yml

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
