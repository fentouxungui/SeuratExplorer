# SeuratExplorer app-layer bundle builder.
# Place at  SeuratExplorer/.github/workflows/build-app-bundle.yml
#
# Produces, per platform:  seurat-explorer-<version>-<platform>.zip
#   bundle/ +- manifest.json +- app/app.R +- rlib/<Pkg>/
#
# IMPORTANT: the release tag version and DESCRIPTION Version must match, or the
# built source tarball name will not match and the bundle is built without the
# app (the install step below aborts in that case).

name: Build app bundle

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach bundles to (e.g. v0.1.10)"
        required: false
        type: string

permissions:
  contents: read

env:
  APP_ID: seurat-explorer
  APP_NAME: SeuratExplorer
  APP_AUTHOR: "Zhang Yongchao"
  APP_DESC: "Explore scRNA-seq data processed in Seurat"
  APP_HOMEPAGE: "https://github.com/fentouxungui/SeuratExplorer"
  APP_LICENSE: "GPL-3.0-or-later"
  R_VERSION: "4.6.1"
  CRAN_SNAPSHOT: "2026-10-01"
  SMOKE: "on"
  SMOKE_TIMEOUT_SEC: "300"

jobs:
  bundle:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: "win-x64" }
          - { os: macos-15,       platform: "mac-arm64" }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}
          use-public-rspm: false

      - name: Install build helpers
        shell: Rscript {0}
        run: |
          snap <- Sys.getenv("CRAN_SNAPSHOT")
          cran <- if (nzchar(snap)) sprintf("https://packagemanager.posit.co/cran/%s", snap) else "https://cloud.r-project.org"
          install.packages(c("jsonlite","zip","digest","BiocManager","callr","curl"), repos = cran)

      - name: Resolve and validate version
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          V="${INPUT_TAG:-${RELEASE_TAG:-}}"
          V="${V#v}"
          if [ -z "$V" ]; then V="$(grep '^Version:' DESCRIPTION | awk '{print $2}' | head -n1)"; fi
          if [ -z "$V" ]; then echo "::error::cannot resolve version"; exit 1; fi
          TAG="v$V"
          if [ -n "${INPUT_TAG}${RELEASE_TAG}" ]; then
            if ! git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::tag $TAG does not exist in this checkout"
              exit 1
            fi
            TAG_COMMIT="$(git rev-parse "$TAG^{commit}")"
            HEAD_COMMIT="$(git rev-parse HEAD)"
            if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
              echo "::error::checked-out commit $HEAD_COMMIT does not match $TAG ($TAG_COMMIT)"
              exit 1
            fi
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "building $TAG at $(git rev-parse HEAD)"

      - name: Build source tarball
        shell: bash
        run: R CMD build --no-build-vignettes --no-manual .

      - name: Install app + dependency closure into bundle/rlib
        shell: Rscript {0}
        run: |
          bundle <- file.path(getwd(), "bundle")
          unlink(bundle, recursive = TRUE); dir.create(bundle, recursive = TRUE)
          lib <- file.path(bundle, "rlib"); dir.create(lib, recursive = TRUE)
          snap <- Sys.getenv("CRAN_SNAPSHOT")
          cran <- if (nzchar(snap)) sprintf("https://packagemanager.posit.co/cran/%s", snap) else "https://cloud.r-project.org"
          bioc <- BiocManager::repositories()
          if (!is.null(names(bioc))) bioc <- bioc[!grepl("cran", names(bioc), ignore.case = TRUE)]
          repos <- c(CRAN = cran, bioc)
          options(repos = repos)
          cat("CRAN:", cran, "\n")

          tb <- list.files(".", pattern = sprintf("^SeuratExplorer_%s[.]tar[.]gz$", Sys.getenv("VERSION")), full.names = TRUE)
          if (length(tb) == 0) {
            stop(sprintf("SeuratExplorer_%s.tar.gz not found -- bump DESCRIPTION Version to match the tag (version mismatch)", Sys.getenv("VERSION")))
          }
          local_extra <- list.files("dependency", pattern = "^presto-.*[.]tar[.]gz$", full.names = TRUE)
          local_paths <- normalizePath(c(tb, local_extra), winslash = "/", mustWork = TRUE)

          read_desc <- function(p) {
            td <- tempfile(); dir.create(td)
            utils::untar(p, exdir = td)
            dd <- list.files(td, pattern = "^DESCRIPTION$", recursive = TRUE, full.names = TRUE)[1]
            read.dcf(dd)
          }
          dcfs <- lapply(local_paths, read_desc)
          loc_names <- vapply(dcfs, function(d) d[1, "Package"], character(1))
          declared <- unique(unlist(lapply(dcfs, function(d) {
            fields <- intersect(c("Depends", "Imports", "LinkingTo"), colnames(d))
            vals <- unlist(lapply(fields, function(f) if (is.na(d[1, f])) "" else d[1, f]))
            parts <- trimws(unlist(strsplit(paste(vals, collapse = ","), ",")))
            parts <- trimws(sub("\\(.*\\)$", "", parts))
            parts[nzchar(parts) & parts != "R"]
          })))

          db <- available.packages(repos = repos)
          # Optional modules in the latest SeuratExplorer use these
          # Suggests/Remotes packages. Install them so the desktop bundle
          # exposes heatmaps, DE tests, gene-set scoring and ATAC support.
          # presto is installed from dependency/ below.
          extra_pkgs <- c("ComplexHeatmap", "patchwork", "MAST", "limma",
                          "DESeq2", "AUCell", "Signac")
          seed <- unique(c(loc_names, declared, extra_pkgs))
          closure <- unique(c(
            unlist(tools::package_dependencies(seed, db = db, recursive = TRUE)),
            declared, extra_pkgs
          ))
          # base + recommended come from the shell's bundled R. Never ship them
          # in rlib: on macOS they may link to the builder's R.framework and
          # fail on users' Macs. Do not use a plain installed.packages() here:
          # it would also drop toolchain packages the app may need at runtime.
          base_pkgs <- rownames(installed.packages(priority = c("base", "recommended")))
          closure <- setdiff(closure, c(loc_names, base_pkgs, basename(list.dirs(lib, recursive = FALSE))))
          if (length(closure)) {
            install.packages(closure, lib = lib, repos = repos, type = "both",
                             dependencies = FALSE, Ncpus = 2)
          }
          have <- function() basename(list.dirs(lib, recursive = FALSE))
          miss <- setdiff(closure, have())
          if (length(miss)) {
            cat("source retry:", paste(miss, collapse = ", "), "\n")
            install.packages(miss, lib = lib, repos = repos, type = "source",
                             dependencies = FALSE, Ncpus = 2)
          }
          install.packages(local_paths, lib = lib, repos = NULL, type = "source", dependencies = FALSE)

          missing <- setdiff(loc_names, have())
          if (length(missing)) stop("local packages not installed: ", paste(missing, collapse = ", "))
          missing_extra <- setdiff(extra_pkgs, have())
          if (length(missing_extra)) {
            cat("WARN optional packages not installed: ",
                paste(missing_extra, collapse = ", "), "\n")
          }
          cat("rlib packages:", length(have()), "\n")

          # The shell's bundled R provides base/recommended packages. Shipping
          # them in rlib shadows the runtime copy; on macOS the copied binary
          # may reference the builder's R.framework and fail on the user's Mac.
          runtime_pkgs <- rownames(installed.packages(priority = c("base", "recommended")))
          bad_runtime <- intersect(have(), runtime_pkgs)
          if (length(bad_runtime)) {
            stop("rlib contains base/recommended packages: ", paste(bad_runtime, collapse = ", "),
                 ". Remove them; the bundled R provides them.")
          }

          if (identical(unname(Sys.info()[["sysname"]]), "Darwin")) {
            bins <- list.files(lib, pattern = "[.](so|dylib)$", recursive = TRUE, full.names = TRUE)
            bad <- character()
            for (b in bins) {
              o <- suppressWarnings(system2("otool", c("-L", shQuote(b)), stdout = TRUE, stderr = FALSE))
              if (any(grepl("(/opt/X11|/opt/homebrew|/usr/local/opt|/Library/Frameworks/R.framework)", o))) bad <- c(bad, b)
            }
            if (length(bad)) {
              stop("non-portable dylib references in ", length(bad), " file(s): ",
                   paste(unique(basename(bad)), collapse = ", "),
                   ". Rebuild with SOURCE_REBUILD=<pkg>, or drop the package/feature; see references/macos-portability.md")
            }
          }

      - name: Assemble app + manifest.json
        shell: Rscript {0}
        run: |
          bundle <- file.path(getwd(), "bundle")
          lib <- file.path(bundle, "rlib")
          dir.create(file.path(bundle, "app"), recursive = TRUE, showWarnings = FALSE)
          writeLines(c(
            'library(SeuratExplorer)',
            'options(shiny.launch.browser = FALSE, shiny.deprecation.messages = FALSE)',
            'launchSeuratExplorer(verbose = FALSE,',
            '  ReductionKeyWords = c("umap","tsne","pca"),',
            '  SplitOptionMaxLevel = 12, MaxInputFileSize = 30 * 1024^3)'
          ), file.path(bundle, "app", "app.R"))

          pkgs <- as.data.frame(installed.packages(lib.loc = lib))
          man <- list(
            schema = 1L,
            id = Sys.getenv("APP_ID"), name = Sys.getenv("APP_NAME"), version = Sys.getenv("VERSION"),
            author = Sys.getenv("APP_AUTHOR"), description = Sys.getenv("APP_DESC"),
            homepage = Sys.getenv("APP_HOMEPAGE"), license = Sys.getenv("APP_LICENSE"),
            runtime = "r-shiny", entry = "app/app.R",
            platform = "${{ matrix.platform }}",
            r_version = Sys.getenv("R_VERSION"), min_shell_version = "0.1.0",
            notes = paste(
              "The demo dataset is downloaded only after the user clicks",
              "'Download and Run a demo data'; the app starts without network.",
              "Optional modules use ComplexHeatmap, patchwork, MAST, limma,",
              "DESeq2, AUCell and Signac when installed."
            ),
            packages = lapply(seq_len(nrow(pkgs)), function(i) list(
              name = pkgs$Package[i], version = pkgs$Version[i],
              path = file.path("rlib", pkgs$Package[i]), source = "cran"))
          )
          jsonlite::write_json(man, file.path(bundle, "manifest.json"), pretty = TRUE, auto_unbox = TRUE)

      - name: Zip + sha256
        shell: Rscript {0}
        run: |
          out <- sprintf("%s-%s-%s.zip", Sys.getenv("APP_ID"), Sys.getenv("VERSION"), "${{ matrix.platform }}")
          bundle <- file.path(getwd(), "bundle")
          old <- setwd(bundle); on.exit(setwd(old))
          zip::zipr(out, files = list.files(".", all.files = TRUE, no.. = TRUE))
          entries <- utils::unzip(out, list = TRUE)$Name
          if (!any(grepl("^rlib/", entries))) stop("zip is missing rlib/ -- aborting")
          if (!any(grepl("^app/app[.]R$", entries))) stop("zip is missing app/app.R -- aborting")
          setwd(old)
          file.rename(file.path(bundle, out), out)
          sha <- digest::digest(out, algo = "sha256", file = TRUE)
          jsonlite::write_json(list(
            app_id = Sys.getenv("APP_ID"), version = Sys.getenv("VERSION"),
            platform = "${{ matrix.platform }}", file = out, sha256 = sha, size = file.size(out),
            source_repository = Sys.getenv("GITHUB_REPOSITORY"),
            source_commit = Sys.getenv("SOURCE_COMMIT"),
            source_tag = Sys.getenv("TAG"),
            cran_snapshot = Sys.getenv("CRAN_SNAPSHOT")
          ), sprintf("meta-%s.json", "${{ matrix.platform }}"), pretty = TRUE, auto_unbox = TRUE)
          cat("bundle zip size:", file.size(out), "\n")

      - name: Smoke test (start the bundle like the ShinyApps shell)
        if: ${{ env.SMOKE != 'off' }}
        timeout-minutes: 12
        shell: Rscript {0}
        run: |
          app_id <- Sys.getenv("APP_ID"); ver <- Sys.getenv("VERSION"); plat <- "${{ matrix.platform }}"
          zip <- sprintf("%s-%s-%s.zip", app_id, ver, plat)
          if (!file.exists(zip)) stop("smoke: bundle not found: ", zip)
          tmp <- tempfile("smoke"); dir.create(tmp)
          utils::unzip(zip, exdir = tmp)
          appdir <- file.path(tmp, "app"); lib <- file.path(tmp, "rlib")
          if (!dir.exists(appdir) || !dir.exists(lib)) stop("smoke: unexpected bundle layout")
          .libPaths(c(lib, .libPaths()))
          timeout <- suppressWarnings(as.integer(Sys.getenv("SMOKE_TIMEOUT_SEC", "300"))); if (is.na(timeout) || timeout < 30) timeout <- 300
          serve <- function(appdir, lib, port) {
            .libPaths(c(lib, .Library))
            old <- setwd(appdir); on.exit(setwd(old), add = TRUE)
            shiny::runApp(".", port = port, host = "127.0.0.1", launch.browser = FALSE, quiet = TRUE)
          }
          port <- httpuv::randomPort()
          proc <- callr::r_bg(serve, args = list(appdir = appdir, lib = lib, port = port),
                              supervise = TRUE, env = c(R_LIBS_USER = "", R_LIBS_SITE = ""))
          on.exit(try(proc$kill(), silent = TRUE), add = TRUE)
          url <- sprintf("http://127.0.0.1:%d/", port)
          deadline <- Sys.time() + timeout
          out <- character()
          repeat {
            out <- c(out, proc$read_output_lines(), proc$read_error_lines())
            if (!proc$is_alive()) {
              cat(paste(out, collapse = "\n"), "\n")
              stop("smoke test FAILED: the app exited before serving a page")
            }
            served <- tryCatch({
              h <- curl::new_handle(connecttimeout = 5L, timeout = 10L)
              r <- curl::curl_fetch_memory(url, handle = h)
              r$status_code == 200L && length(r$content) > 0 &&
                grepl("<!doctype|<html", rawToChar(r$content), ignore.case = TRUE)
            }, error = function(e) FALSE)
            if (isTRUE(served)) break
            if (Sys.time() >= deadline) {
              cat(paste(out, collapse = "\n"), "\n")
              stop("smoke test FAILED: ", url, " did not serve a page within ", timeout, "s")
            }
            Sys.sleep(1)
          }
          cat("SMOKE OK:", url, "served an HTML page\n")

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          path: |
            *.zip
            meta-*.json

  release:
    needs: bundle
    if: github.event_name == 'release' || github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Consolidate release metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime, glob, json, os

          metas = {}
          for path in sorted(glob.glob("artifacts/meta-*.json")):
              platform = os.path.basename(path)[5:-5]
              metas[platform] = json.load(open(path))
          first = next(iter(metas.values()), {})
          info = {
              "app_id": first.get("app_id", "seurat-explorer"),
              "version": first.get("version", ""),
              "source_repository": first.get("source_repository", ""),
              "source_commit": first.get("source_commit", ""),
              "generated_at": datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "platforms": metas,
          }
          with open("artifacts/build-info.json", "w") as fh:
              json.dump(info, fh, indent=2)
              fh.write("\n")
          PY
          cd artifacts && sha256sum *.zip > SHA256SUMS
          rm -f meta-*.json
      - name: Refuse to overwrite published assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          ERR="$(mktemp)"
          set +e
          release_json="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets,name 2>"$ERR")"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            existing="$(printf '%s' "$release_json" | jq -r '.assets[]?.name')"
            for f in artifacts/*; do
              n="$(basename "$f")"
              if printf '%s\n' "$existing" | grep -qxF "$n"; then
                echo "::error::release asset already exists: $n"
                exit 1
              fi
            done
          elif grep -qiE 'release not found|HTTP 404' "$ERR"; then
            echo "release $TAG does not exist yet; the upload step will create it"
          else
            echo "::error::could not read release $TAG; refusing to guess"
            cat "$ERR"
            exit 1
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.release.name || github.event.inputs.tag || github.ref_name }}
          files: |
            artifacts/*.zip
            artifacts/SHA256SUMS
            artifacts/build-info.json
          overwrite_files: false
          fail_on_unmatched_files: true
          generate_release_notes: false
