# SeuratExplorer app-layer bundle builder.
# Place at  SeuratExplorer/.github/workflows/build-app-bundle.yml
#
# Produces, per platform:  seurat-explorer-<version>-<platform>.zip
#   bundle/ +- manifest.json +- app/app.R +- rlib/<Pkg>/
#
# IMPORTANT: the release tag version and DESCRIPTION Version must match, or the
# built source tarball name will not match and the bundle is built without the
# app (the install step below aborts in that case).

name: Build app bundle

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach bundles to (e.g. v0.1.10)"
        required: false
        type: string

permissions:
  contents: read

env:
  APP_ID: seurat-explorer
  APP_NAME: SeuratExplorer
  APP_AUTHOR: "Zhang Yongchao"
  APP_DESC: "Explore scRNA-seq data processed in Seurat"
  APP_HOMEPAGE: "https://github.com/fentouxungui/SeuratExplorer"
  APP_LICENSE: "GPL-3.0-or-later"
  R_VERSION: "4.6.1"
  CRAN_SNAPSHOT: "2026-10-01"
  SMOKE: "on"
  SMOKE_TIMEOUT_SEC: "300"

jobs:
  bundle:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: "win-x64" }
          - { os: macos-15,       platform: "mac-arm64" }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}
          use-public-rspm: false

      - name: Set up portable R (matches the ShinyApps shell)
        shell: bash
        env:
          CRAN_SNAPSHOT: ${{ env.CRAN_SNAPSHOT }}
        run: |
          set -euo pipefail
          if [ -n "${CRAN_SNAPSHOT:-}" ]; then
            CRAN="https://packagemanager.posit.co/cran/${CRAN_SNAPSHOT}"
          else
            CRAN="https://cloud.r-project.org"
          fi
          SETUP_DIR="${RUNNER_TEMP:-/tmp}/shinyapps-portable-r"
          mkdir -p "$SETUP_DIR"
          cat > "$SETUP_DIR/setup-portable-r.R" <<'EOF'
          ver <- Sys.getenv("R_VERSION")
          plat <- if (.Platform$OS.type == "windows") "win" else "mac"
          arch <- if (toupper(Sys.getenv("RUNNER_ARCH")) == "ARM64") "arm64" else "x64"
          root <- file.path(Sys.getenv("RUNNER_TEMP"), "shinyapps-portable-r")
          dir.create(root, recursive = TRUE, showWarnings = FALSE)
          root <- normalizePath(root, winslash = "/", mustWork = TRUE)
          if (plat == "win") {
            win_arch <- if (arch == "arm64") "aarch64" else "x64"
            url <- sprintf("https://github.com/portable-r/portable-r-windows/releases/download/v%s/portable-r-%s-win-%s.zip", ver, ver, win_arch)
            archive <- file.path(root, basename(url))
            download.file(url, archive, mode = "wb", quiet = FALSE)
            utils::unzip(archive, exdir = root)
          } else {
            mac_arch <- if (arch == "arm64") "arm64" else "x86_64"
            url <- sprintf("https://github.com/portable-r/portable-r-macos/releases/download/v%s/portable-r-%s-macos-%s.tar.gz", ver, ver, mac_arch)
            archive <- file.path(root, basename(url))
            download.file(url, archive, mode = "wb", quiet = FALSE)
            utils::untar(archive, exdir = root)
          }
          # Resolve symlinks that point outside the extracted tree. Portable R
          # may link Rscript/fonts to paths that do not exist on the runner.
          all_files <- list.files(root, recursive = TRUE, full.names = TRUE, all.files = TRUE)
          for (f in all_files) {
            link <- Sys.readlink(f)
            if (nzchar(link)) {
              target <- normalizePath(f, mustWork = FALSE)
              if (file.exists(target)) {
                file.remove(f)
                file.copy(target, f, copy.date = TRUE)
              } else {
                file.remove(f)
              }
            }
          }
          any_rs <- list.files(root, pattern = "(^|[/\\\\])Rscript(\\.exe)?$", recursive = TRUE, full.names = TRUE)
          bin_rs <- any_rs[grepl("[/\\\\]bin[/\\\\]", any_rs)]
          rscript <- if (length(bin_rs)) bin_rs[[1]] else if (length(any_rs)) any_rs[[1]] else NA_character_
          if (!is.na(rscript)) rscript <- gsub("\\\\", "/", rscript)
          if (!is.na(rscript)) cat("portable Rscript: ", rscript, "\n", sep = "")
          if (!is.na(rscript)) cat(sprintf("PORTABLE_RSCRIPT=%s\n", rscript), file = Sys.getenv("GITHUB_ENV"), append = TRUE)
          if (is.na(rscript)) {
            cat("Extracted files under ", root, ":\n", sep = "")
            print(list.files(root, recursive = TRUE, full.names = TRUE))
            stop("portable Rscript not found under ", root)
          }
          cat(dirname(rscript), "\n", sep = "", file = Sys.getenv("GITHUB_PATH"), append = TRUE)
          setup_dir <- file.path(root, "harness-root")
          dir.create(setup_dir, recursive = TRUE, showWarnings = FALSE)
          cat(rscript, "\n", sep = "", file = file.path(setup_dir, "rscript.txt"))
          harness <- file.path(setup_dir, "harness")
          dir.create(harness, recursive = TRUE, showWarnings = FALSE)
          harness <- normalizePath(harness, winslash = "/", mustWork = TRUE)
          cat(harness, "\n", sep = "", file = file.path(setup_dir, "lib.txt"))
          cat(sprintf("R_LIBS_USER=%s\n", harness), file = Sys.getenv("GITHUB_ENV"), append = TRUE)
          EOF
          RSCRIPT_BIN="$(command -v Rscript || command -v Rscript.exe || true)"
          if [ -z "$RSCRIPT_BIN" ] && [ -n "${R_HOME:-}" ]; then
            for cand in "$R_HOME/bin/Rscript.exe" "$R_HOME/bin/Rscript"; do
              if [ -x "$cand" ]; then RSCRIPT_BIN="$cand"; break; fi
            done
          fi
          if [ -z "$RSCRIPT_BIN" ]; then echo "::error::Rscript not found"; exit 1; fi
          "$RSCRIPT_BIN" "$SETUP_DIR/setup-portable-r.R"
          # Build helpers go into a sibling harness library, not the portable R's
          # own library (the shell's embed path avoids that on macOS hardened
          # runtime grounds). App packages are installed separately into rlib.
          HARNESS_LIB="$(cat "$SETUP_DIR/harness-root/lib.txt")"
          export R_HOME= R_LIBS_USER="$HARNESS_LIB" R_LIBS_SITE="$HARNESS_LIB" R_LIBS=
          export R_ENVIRON= R_ENVIRON_USER= R_PROFILE_USER=
          unset R_PROFILE
          RSCRIPT="$(cat "$SETUP_DIR/harness-root/rscript.txt")"
          # macOS: portable R's own etc/Rprofile.site installs the .portable
          # environment that rewrites CRAN binary .so files from absolute
          # R.framework paths to @rpath. An EMPTY R_PROFILE disables the
          # default site profile, so set it explicitly. The site profile
          # resets .libPaths(); a user profile adds the harness library back.
          # cat() inserts a space between arguments; use one argument and
          # strip any trailing whitespace so the path is exact.
          PORTABLE_R_HOME="$("$RSCRIPT" -e 'cat(R.home())')"
          PORTABLE_R_HOME="$(printf '%s' "$PORTABLE_R_HOME" | sed 's/[[:space:]]*$//')"
          export R_HOME="$PORTABLE_R_HOME"
          if [ "$(uname -s)" = "Darwin" ]; then
            PORTABLE_SITE_PROFILE="$PORTABLE_R_HOME/etc/Rprofile.site"
            if [ ! -f "$PORTABLE_SITE_PROFILE" ]; then
              echo "::error::portable Rprofile.site not found at $PORTABLE_SITE_PROFILE"
              exit 1
            fi
            PORTABLE_USER_PROFILE="$SETUP_DIR/portable-user-profile.R"
            cat > "$PORTABLE_USER_PROFILE" <<'EOF'
          local({
            harness <- strsplit(Sys.getenv("R_LIBS_SITE"), .Platform$path.sep, fixed = TRUE)[[1]]
            harness <- harness[nzchar(harness)]
            if (length(harness)) .libPaths(c(harness, .libPaths()))
          })
          EOF
            export R_PROFILE="$PORTABLE_SITE_PROFILE" R_PROFILE_USER="$PORTABLE_USER_PROFILE"
          else
            export R_PROFILE= R_PROFILE_USER=
          fi
          "$RSCRIPT" -e "install.packages(c('jsonlite','zip','digest','BiocManager','callr','curl','httpuv'), lib='$HARNESS_LIB', repos='$CRAN')"
          # Rscript takes the script path positionally (no -f). Verify that
          # exact invocation here, so a wrapper regression fails early.
          cat > "$SETUP_DIR/check-script.R" <<'EOF'
          cat("portable Rscript OK:", as.character(getRversion()), "| R_HOME:", R.home(), "| .portable:", ".portable" %in% search(), "\n")
          harness <- strsplit(Sys.getenv("R_LIBS_SITE"), .Platform$path.sep, fixed = TRUE)[[1]]
          harness <- harness[nzchar(harness)]
          norm_path <- function(x) normalizePath(x, winslash = "/", mustWork = FALSE)
          if (length(setdiff(norm_path(harness), norm_path(.libPaths())))) {
            stop("portable R harness library is not on .libPaths(): ",
                 paste(setdiff(norm_path(harness), norm_path(.libPaths())), collapse = ", "))
          }
          for (p in c("jsonlite", "zip", "digest", "BiocManager", "callr", "curl", "httpuv")) {
            if (!requireNamespace(p, quietly = TRUE)) stop("portable R harness package is not loadable: ", p)
          }
          if (identical(.Platform$OS.type, "unix") && !".portable" %in% search()) {
            stop("portable R .portable environment did not attach; macOS binary patching is disabled")
          }
          EOF
          "$RSCRIPT" "$SETUP_DIR/check-script.R"
          echo "R_HOME=$PORTABLE_R_HOME" >> "$GITHUB_ENV"
          echo "R_LIBS_SITE=$HARNESS_LIB" >> "$GITHUB_ENV"
          echo "R_LIBS=" >> "$GITHUB_ENV"
          echo "R_ENVIRON=" >> "$GITHUB_ENV"
          echo "R_ENVIRON_USER=" >> "$GITHUB_ENV"
          echo "R_PROFILE=$R_PROFILE" >> "$GITHUB_ENV"
          echo "R_PROFILE_USER=$R_PROFILE_USER" >> "$GITHUB_ENV"

      - name: Resolve and validate version
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          V="${INPUT_TAG:-${RELEASE_TAG:-}}"
          V="${V#v}"
          if [ -z "$V" ]; then V="$(grep '^Version:' DESCRIPTION | awk '{print $2}' | head -n1)"; fi
          if [ -z "$V" ]; then echo "::error::cannot resolve version"; exit 1; fi
          TAG="v$V"
          if [ -n "${INPUT_TAG}${RELEASE_TAG}" ]; then
            if ! git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::tag $TAG does not exist in this checkout"
              exit 1
            fi
            TAG_COMMIT="$(git rev-parse "$TAG^{commit}")"
            HEAD_COMMIT="$(git rev-parse HEAD)"
            if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
              echo "::error::checked-out commit $HEAD_COMMIT does not match $TAG ($TAG_COMMIT)"
              exit 1
            fi
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "building $TAG at $(git rev-parse HEAD)"

      - name: Build source tarball
        shell: bash
        run: |
          R_BIN="$(dirname "$PORTABLE_RSCRIPT")/R"
          if [ ! -x "$R_BIN" ] && [ -x "$R_BIN.exe" ]; then R_BIN="$R_BIN.exe"; fi
          "$R_BIN" CMD build --no-build-vignettes --no-manual .

      - name: Install app + dependency closure into bundle/rlib
        shell: bash
        run: |
          cat > install-bundle.R <<'EOF'
          cat("R_HOME:", R.home(), " site:", file.exists(file.path(R.home("etc"), "Rprofile.site")), "\n")
          bundle <- file.path(getwd(), "bundle")
          unlink(bundle, recursive = TRUE); dir.create(bundle, recursive = TRUE)
          lib <- file.path(bundle, "rlib"); dir.create(lib, recursive = TRUE)
          .libPaths(c(lib, .libPaths()))
          Sys.setenv(R_LIBS_SITE = paste(unique(c(Sys.getenv("R_LIBS_SITE"), lib)), collapse = .Platform$path.sep))
          snap <- Sys.getenv("CRAN_SNAPSHOT")
          cran <- if (nzchar(snap)) sprintf("https://packagemanager.posit.co/cran/%s", snap) else "https://cloud.r-project.org"
          bioc <- BiocManager::repositories()
          if (!is.null(names(bioc))) bioc <- bioc[!grepl("cran", names(bioc), ignore.case = TRUE)]
          repos <- c(CRAN = cran, bioc)
          options(repos = repos)
          cat("CRAN:", cran, "\n")

          tb <- list.files(".", pattern = sprintf("^SeuratExplorer_%s[.]tar[.]gz$", Sys.getenv("VERSION")), full.names = TRUE)
          if (length(tb) == 0) {
            stop(sprintf("SeuratExplorer_%s.tar.gz not found -- bump DESCRIPTION Version to match the tag (version mismatch)", Sys.getenv("VERSION")))
          }
          # presto now comes from CRAN (see required_extra below); dependency/
          # only holds the locally built SeuratExplorer tarball.
          local_paths <- normalizePath(tb, winslash = "/", mustWork = TRUE)

          read_desc <- function(p) {
            td <- tempfile(); dir.create(td)
            utils::untar(p, exdir = td)
            dd <- list.files(td, pattern = "^DESCRIPTION$", recursive = TRUE, full.names = TRUE)[1]
            read.dcf(dd)
          }
          dcfs <- lapply(local_paths, read_desc)
          loc_names <- vapply(dcfs, function(d) d[1, "Package"], character(1))
          declared <- unique(unlist(lapply(dcfs, function(d) {
            fields <- intersect(c("Depends", "Imports", "LinkingTo"), colnames(d))
            vals <- unlist(lapply(fields, function(f) if (is.na(d[1, f])) "" else d[1, f]))
            parts <- trimws(unlist(strsplit(paste(vals, collapse = ","), ",")))
            parts <- trimws(sub("\\(.*\\)$", "", parts))
            parts[nzchar(parts) & parts != "R"]
          })))

          db <- available.packages(repos = repos)
          # Optional modules in the latest SeuratExplorer use these
          # Suggests/Remotes packages. Suggests are NOT part of the default
          # dependency closure (Seurat itself only Suggests presto), so every
          # package a shipped feature needs must be listed explicitly.
          # presto is on CRAN (1.1.0, 2026-09-30) and powers the fast
          # marker-test path, so a missing copy fails the build.
          required_extra <- c("presto")
          optional_extra <- c("ComplexHeatmap", "patchwork", "MAST", "limma",
                              "DESeq2", "AUCell", "Signac")
          extra_pkgs <- c(required_extra, optional_extra)
          seed <- unique(c(loc_names, declared, extra_pkgs))
          closure <- unique(c(
            unlist(tools::package_dependencies(seed, db = db, recursive = TRUE)),
            declared, extra_pkgs
          ))
          # base + recommended come from the shell's bundled R. Never ship them
          # in rlib: on macOS they may link to the builder's R.framework and
          # fail on users' Macs. Do not use a plain installed.packages() here:
          # it would also drop toolchain packages the app may need at runtime.
          base_pkgs <- rownames(installed.packages(priority = c("base", "recommended")))
          closure <- setdiff(closure, c(loc_names, base_pkgs, basename(list.dirs(lib, recursive = FALSE))))
          if (length(closure)) {
            install.packages(closure, lib = lib, repos = repos, type = "both",
                             dependencies = FALSE, Ncpus = 2)
          }
          have <- function() basename(list.dirs(lib, recursive = FALSE))
          miss <- setdiff(closure, have())
          if (length(miss)) {
            cat("source retry:", paste(miss, collapse = ", "), "\n")
            install.packages(miss, lib = lib, repos = repos, type = "source",
                             dependencies = FALSE, Ncpus = 2)
          }
          install.packages(local_paths, lib = lib, repos = NULL, type = "source", dependencies = FALSE)

          missing <- setdiff(loc_names, have())
          if (length(missing)) stop("local packages not installed: ", paste(missing, collapse = ", "))
          missing_required <- setdiff(required_extra, have())
          if (length(missing_required)) {
            stop("required packages not installed: ",
                 paste(missing_required, collapse = ", "))
          }
          missing_optional <- setdiff(optional_extra, have())
          if (length(missing_optional)) {
            cat("WARN optional packages not installed: ",
                paste(missing_optional, collapse = ", "), "\n")
          }
          cat("rlib packages:", length(have()), "\n")

          # The shell's bundled R provides base/recommended packages. Shipping
          # them in rlib shadows the runtime copy; on macOS the copied binary
          # may reference the builder's R.framework and fail on the user's Mac.
          runtime_pkgs <- rownames(installed.packages(priority = c("base", "recommended")))
          bad_runtime <- intersect(have(), runtime_pkgs)
          if (length(bad_runtime)) {
            stop("rlib contains base/recommended packages: ", paste(bad_runtime, collapse = ", "),
                 ". Remove them; the bundled R provides them.")
          }

          if (identical(unname(Sys.info()[["sysname"]]), "Darwin")) {
            bins <- list.files(lib, pattern = "[.](so|dylib)$", recursive = TRUE, full.names = TRUE)
            rhome <- normalizePath(R.home(), winslash = "/", mustWork = FALSE)
            bad <- character(); bad_refs <- character()
            for (b in bins) {
              o <- suppressWarnings(system2("otool", c("-L", shQuote(b)), stdout = TRUE, stderr = FALSE))
              hit <- o[grepl("(/opt/X11|/opt/homebrew|/usr/local/opt|/Library/Frameworks/R.framework)", o)]
              if (!length(hit) && nzchar(rhome)) hit <- o[grepl(rhome, o, fixed = TRUE)]
              if (length(hit)) {
                bad <- c(bad, b)
                bad_refs <- c(bad_refs, paste0(b, " -> ", paste(trimws(hit), collapse = " | ")))
              }
            }
            if (length(bad)) {
              cat("non-portable dylib references:\n", paste(bad_refs, collapse = "\n"), "\n")
              stop("non-portable dylib references in ", length(bad), " file(s): ",
                   paste(unique(basename(bad)), collapse = ", "),
                   ". Rebuild with SOURCE_REBUILD=<pkg>, or drop the package/feature; see references/macos-portability.md")
            }
          }
          EOF
          # Rscript takes the script path positionally; it does not support -f.
          "$PORTABLE_RSCRIPT" install-bundle.R

      - name: Assemble app + manifest.json
        shell: bash
        run: |
          cat > assemble-bundle.R <<'EOF'
          bundle <- file.path(getwd(), "bundle")
          lib <- file.path(bundle, "rlib")
          dir.create(file.path(bundle, "app"), recursive = TRUE, showWarnings = FALSE)
          writeLines(c(
            'library(SeuratExplorer)',
            'options(shiny.launch.browser = FALSE, shiny.deprecation.messages = FALSE)',
            'launchSeuratExplorer(verbose = FALSE,',
            '  ReductionKeyWords = c("umap","tsne","pca"),',
            '  SplitOptionMaxLevel = 12, MaxInputFileSize = 30 * 1024^3)'
          ), file.path(bundle, "app", "app.R"))

          pkgs <- as.data.frame(installed.packages(lib.loc = lib))
          man <- list(
            schema = 1L,
            id = Sys.getenv("APP_ID"), name = Sys.getenv("APP_NAME"), version = Sys.getenv("VERSION"),
            author = Sys.getenv("APP_AUTHOR"), description = Sys.getenv("APP_DESC"),
            homepage = Sys.getenv("APP_HOMEPAGE"), license = Sys.getenv("APP_LICENSE"),
            runtime = "r-shiny", entry = "app/app.R",
            platform = "${{ matrix.platform }}",
            r_version = Sys.getenv("R_VERSION"), min_shell_version = "0.1.0",
            notes = paste(
              "The demo dataset is downloaded only after the user clicks",
              "'Download and Run a demo data'; the app starts without network.",
              "Optional modules use presto, ComplexHeatmap, patchwork, MAST,",
              "limma, DESeq2, AUCell and Signac when installed."
            ),
            packages = lapply(seq_len(nrow(pkgs)), function(i) list(
              name = pkgs$Package[i], version = pkgs$Version[i],
              path = file.path("rlib", pkgs$Package[i]), source = "cran"))
          )
          jsonlite::write_json(man, file.path(bundle, "manifest.json"), pretty = TRUE, auto_unbox = TRUE)
          EOF
          "$PORTABLE_RSCRIPT" assemble-bundle.R

      - name: Re-sign macOS binaries after portable-R patching
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # portable R's .portable wrapper rewrites CRAN .so load commands after
          # install.packages(), but does not re-sign them. macOS kills R with
          # "Code Signature Invalid" when such a .so is loaded from the bundle.
          # Re-sign every Mach-O file before zipping, then verify the result.
          while IFS= read -r -d '' f; do
            if file -b "$f" | grep -q 'Mach-O'; then
              xattr -cr "$f" 2>/dev/null || true
              chmod u+w "$f" 2>/dev/null || true
              codesign --force --sign - "$f"
            fi
          done < <(find bundle -type f -print0)

          bad=0
          while IFS= read -r -d '' f; do
            if file -b "$f" | grep -q 'Mach-O'; then
              if ! codesign --verify --verbose=1 "$f" >/dev/null 2>&1; then
                echo "::error::invalid code signature: $f"
                bad=1
              fi
            fi
          done < <(find bundle -type f -print0)
          exit "$bad"

      - name: Zip + sha256
        shell: bash
        run: |
          cat > zip-bundle.R <<'EOF'
          out <- sprintf("%s-%s-%s.zip", Sys.getenv("APP_ID"), Sys.getenv("VERSION"), "${{ matrix.platform }}")
          bundle <- file.path(getwd(), "bundle")
          old <- setwd(bundle); on.exit(setwd(old))
          zip::zipr(out, files = list.files(".", all.files = TRUE, no.. = TRUE))
          entries <- utils::unzip(out, list = TRUE)$Name
          if (!any(grepl("^rlib/", entries))) stop("zip is missing rlib/ -- aborting")
          if (!any(grepl("^app/app[.]R$", entries))) stop("zip is missing app/app.R -- aborting")
          setwd(old)
          file.rename(file.path(bundle, out), out)
          sha <- digest::digest(out, algo = "sha256", file = TRUE)
          jsonlite::write_json(list(
            app_id = Sys.getenv("APP_ID"), version = Sys.getenv("VERSION"),
            platform = "${{ matrix.platform }}", file = out, sha256 = sha, size = file.size(out),
            source_repository = Sys.getenv("GITHUB_REPOSITORY"),
            source_commit = Sys.getenv("SOURCE_COMMIT"),
            source_tag = Sys.getenv("TAG"),
            cran_snapshot = Sys.getenv("CRAN_SNAPSHOT")
          ), sprintf("meta-%s.json", "${{ matrix.platform }}"), pretty = TRUE, auto_unbox = TRUE)
          cat("bundle zip size:", file.size(out), "\n")
          EOF
          "$PORTABLE_RSCRIPT" zip-bundle.R

      - name: Smoke test (start the bundle like the ShinyApps shell)
        if: ${{ env.SMOKE != 'off' }}
        timeout-minutes: 12
        shell: bash
        run: |
          cat > smoke-bundle.R <<'EOF'
          app_id <- Sys.getenv("APP_ID"); ver <- Sys.getenv("VERSION"); plat <- "${{ matrix.platform }}"
          zip <- sprintf("%s-%s-%s.zip", app_id, ver, plat)
          if (!file.exists(zip)) stop("smoke: bundle not found: ", zip)
          tmp <- tempfile("smoke"); dir.create(tmp)
          utils::unzip(zip, exdir = tmp)
          appdir <- file.path(tmp, "app"); lib <- file.path(tmp, "rlib")
          if (!dir.exists(appdir) || !dir.exists(lib)) stop("smoke: unexpected bundle layout")
          .libPaths(c(lib, .libPaths()))
          timeout <- suppressWarnings(as.integer(Sys.getenv("SMOKE_TIMEOUT_SEC", "300"))); if (is.na(timeout) || timeout < 30) timeout <- 300
          serve <- function(appdir, lib, port) {
            .libPaths(c(lib, .Library))
            old <- setwd(appdir); on.exit(setwd(old), add = TRUE)
            shiny::runApp(".", port = port, host = "127.0.0.1", launch.browser = FALSE, quiet = TRUE)
          }
          port <- httpuv::randomPort()
          proc <- callr::r_bg(serve, args = list(appdir = appdir, lib = lib, port = port),
                              supervise = TRUE, env = c(R_LIBS_USER = "", R_LIBS_SITE = ""))
          on.exit(try(proc$kill(), silent = TRUE), add = TRUE)
          url <- sprintf("http://127.0.0.1:%d/", port)
          deadline <- Sys.time() + timeout
          out <- character()
          repeat {
            out <- c(out, proc$read_output_lines(), proc$read_error_lines())
            if (!proc$is_alive()) {
              cat(paste(out, collapse = "\n"), "\n")
              stop("smoke test FAILED: the app exited before serving a page")
            }
            served <- tryCatch({
              h <- curl::new_handle(connecttimeout = 5L, timeout = 10L)
              r <- curl::curl_fetch_memory(url, handle = h)
              r$status_code == 200L && length(r$content) > 0 &&
                grepl("<!doctype|<html", rawToChar(r$content), ignore.case = TRUE)
            }, error = function(e) FALSE)
            if (isTRUE(served)) break
            if (Sys.time() >= deadline) {
              cat(paste(out, collapse = "\n"), "\n")
              stop("smoke test FAILED: ", url, " did not serve a page within ", timeout, "s")
            }
            Sys.sleep(1)
          }
          cat("SMOKE OK:", url, "served an HTML page\n")
          EOF
          "$PORTABLE_RSCRIPT" smoke-bundle.R

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          path: |
            *.zip
            meta-*.json

  release:
    needs: bundle
    if: github.event_name == 'release' || github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Consolidate release metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime, glob, json, os

          metas = {}
          for path in sorted(glob.glob("artifacts/meta-*.json")):
              platform = os.path.basename(path)[5:-5]
              metas[platform] = json.load(open(path))
          first = next(iter(metas.values()), {})
          info = {
              "app_id": first.get("app_id", "seurat-explorer"),
              "version": first.get("version", ""),
              "source_repository": first.get("source_repository", ""),
              "source_commit": first.get("source_commit", ""),
              "generated_at": datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "platforms": metas,
          }
          with open("artifacts/build-info.json", "w") as fh:
              json.dump(info, fh, indent=2)
              fh.write("\n")
          PY
          cd artifacts && sha256sum *.zip > SHA256SUMS
          rm -f meta-*.json
      - name: Refuse to overwrite published assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          ERR="$(mktemp)"
          set +e
          release_json="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets,name 2>"$ERR")"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            existing="$(printf '%s' "$release_json" | jq -r '.assets[]?.name')"
            for f in artifacts/*; do
              n="$(basename "$f")"
              if printf '%s\n' "$existing" | grep -qxF "$n"; then
                echo "::error::release asset already exists: $n"
                exit 1
              fi
            done
          elif grep -qiE 'release not found|HTTP 404' "$ERR"; then
            echo "release $TAG does not exist yet; the upload step will create it"
          else
            echo "::error::could not read release $TAG; refusing to guess"
            cat "$ERR"
            exit 1
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.release.name || github.event.inputs.tag || github.ref_name }}
          files: |
            artifacts/*.zip
            artifacts/SHA256SUMS
            artifacts/build-info.json
          overwrite_files: false
          fail_on_unmatched_files: true
          generate_release_notes: false
