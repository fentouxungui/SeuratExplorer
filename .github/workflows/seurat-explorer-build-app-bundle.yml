# SeuratExplorer app-layer bundle builder.
# Place at  SeuratExplorer/.github/workflows/build-app-bundle.yml
#
# Produces, per platform:  seurat-explorer-<version>-<platform>.zip
#   bundle/
#   +- manifest.json   (see ShinyApps/schemas/manifest.schema.json)
#   +- app/app.R       (the same Shiny entry point as the desktop build)
#   +- rlib/<Pkg>/     (PREBUILT R package dirs -- the client only copies, never compiles)
#
# Attach to a release either by publishing a release, or by running this
# workflow manually (the `tag` input defaults to v0.1.9).

name: Build app bundle

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach bundles to"
        required: false
        type: string
        default: "v0.1.9"

permissions:
  contents: write

env:
  APP_ID: seurat-explorer
  APP_NAME: SeuratExplorer
  APP_AUTHOR: "Zhang Yongchao"
  APP_DESC: "Explore scRNA-seq data processed in Seurat"
  APP_HOMEPAGE: "https://github.com/fentouxungui/SeuratExplorer"
  APP_LICENSE: "GPL-3.0-or-later"
  # MUST equal the ShinyApps shell runtime R (binary ABI).
  R_VERSION: "4.6.1"

jobs:
  bundle:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: "win-x64" }
          - { os: macos-14,       platform: "mac-arm64" }
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}
          use-public-rspm: true

      - name: Install build helpers
        shell: bash
        run: Rscript -e 'install.packages(c("jsonlite","zip","digest","BiocManager"), repos="https://cloud.r-project.org")'

      - name: Resolve version
        shell: bash
        run: |
          V="${{ github.event.release.tag_name }}${{ inputs.tag }}"
          V="${V#v}"
          if [ -z "$V" ]; then V=$(grep '^Version:' DESCRIPTION | awk '{print $2}'); fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Build source tarball
        shell: bash
        run: R CMD build --no-build-vignettes --no-manual .

      - name: Install app + dependency closure into a staging library
        shell: Rscript {0}
        run: |
          stage <- file.path(getwd(), "stage-lib")
          unlink(stage, recursive = TRUE); dir.create(stage)
          repos <- BiocManager::repositories()
          options(repos = repos)

          tb <- list.files(".", pattern = sprintf("^SeuratExplorer_%s[.]tar[.]gz$", Sys.getenv("VERSION")), full.names = TRUE)
          local_extra <- list.files("dependency", pattern = "^presto-.*[.]tar[.]gz$", full.names = TRUE)
          local_paths <- normalizePath(c(tb, local_extra), winslash = "/", mustWork = TRUE)

          read_desc <- function(p) {
            td <- tempfile(); dir.create(td)
            utils::untar(p, exdir = td)
            dd <- list.files(td, pattern = "^DESCRIPTION$", recursive = TRUE, full.names = TRUE)[1]
            read.dcf(dd)
          }
          dcfs <- lapply(local_paths, read_desc)
          loc_names <- vapply(dcfs, function(d) d[1, "Package"], character(1))
          declared <- unique(unlist(lapply(dcfs, function(d) {
            fields <- intersect(c("Depends", "Imports", "LinkingTo"), colnames(d))
            vals <- unlist(lapply(fields, function(f) if (is.na(d[1, f])) "" else d[1, f]))
            parts <- trimws(unlist(strsplit(paste(vals, collapse = ","), ",")))
            parts <- trimws(sub("\\(.*\\)$", "", parts))
            parts[nzchar(parts) & parts != "R"]
          })))

          db <- available.packages(repos = repos)
          closure <- unique(c(unlist(tools::package_dependencies(loc_names, db = db, recursive = TRUE)), declared))
          closure <- setdiff(closure, c(loc_names, rownames(installed.packages()), rownames(installed.packages(lib.loc = stage))))
          if (length(closure)) {
            install.packages(closure, lib = stage, repos = repos, type = "binary",
                             dependencies = FALSE, Ncpus = 2)
          }
          install.packages(local_paths, lib = stage, repos = NULL, type = "source", dependencies = FALSE)

          missing <- setdiff(loc_names, list.dirs(stage, recursive = FALSE, full.names = FALSE))
          if (length(missing)) stop("local packages not installed: ", paste(missing, collapse = ", "))

      - name: Assemble bundle + manifest.json
        shell: Rscript {0}
        run: |
          bundle <- file.path(getwd(), "bundle")
          unlink(bundle, recursive = TRUE); dir.create(bundle)

          dir.create(file.path(bundle, "app"))
          writeLines(c(
            'library(SeuratExplorer)',
            'options(shiny.launch.browser = FALSE, shiny.deprecation.messages = FALSE)',
            'launchSeuratExplorer(verbose = FALSE,',
            '  ReductionKeyWords = c("umap","tsne","pca"),',
            '  SplitOptionMaxLevel = 12, MaxInputFileSize = 30 * 1024^3)'
          ), file.path(bundle, "app", "app.R"))

          file.copy(file.path(getwd(), "stage-lib"), file.path(bundle, "rlib"), recursive = TRUE)

          pkgs <- as.data.frame(installed.packages(lib.loc = file.path(getwd(), "stage-lib")))
          man <- list(
            schema = 1L,
            id = Sys.getenv("APP_ID"), name = Sys.getenv("APP_NAME"), version = Sys.getenv("VERSION"),
            author = Sys.getenv("APP_AUTHOR"), description = Sys.getenv("APP_DESC"),
            homepage = Sys.getenv("APP_HOMEPAGE"), license = Sys.getenv("APP_LICENSE"),
            runtime = "r-shiny", entry = "app/app.R",
            platform = "${{ matrix.platform }}",
            r_version = Sys.getenv("R_VERSION"), min_shell_version = "0.1.0",
            packages = lapply(seq_len(nrow(pkgs)), function(i) list(
              name = pkgs$Package[i], version = pkgs$Version[i],
              path = file.path("rlib", pkgs$Package[i]), source = "cran"))
          )
          jsonlite::write_json(man, file.path(bundle, "manifest.json"), pretty = TRUE, auto_unbox = TRUE)

      - name: Zip + sha256
        shell: Rscript {0}
        run: |
          out <- sprintf("%s-%s-%s.zip", Sys.getenv("APP_ID"), Sys.getenv("VERSION"), "${{ matrix.platform }}")
          old <- setwd("bundle"); on.exit(setwd(old))
          zip::zip(out, files = list.files(".", recursive = TRUE, all.files = TRUE, no.. = TRUE))
          setwd(old)
          file.rename(file.path("bundle", out), out)
          sha <- digest::digest(out, algo = "sha256", file = TRUE)
          writeLines(sprintf('{"platform":"%s","file":"%s","sha256":"%s","size":%d}',
                     "${{ matrix.platform }}", out, sha, file.size(out)),
                     sprintf("meta-%s.json", "${{ matrix.platform }}"))

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          path: |
            *.zip
            meta-*.json

  release:
    needs: bundle
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: artifacts/*.zip
